- name: variables from running commands
  hosts: localhost
  
  become: true
  
  tasks:
    - name: ip of the manage nodes
      ansible.builtin.debug:
        msg: "{{ ansible_all_ipv4_addresses }}"
      register: ip
    
    - name: Print the output
      ansible.builtin.debug:
        msg: "{{ ip.msg }}"
    
# in shell we call as exit status 
# in ansible we call return code 
    # [ root@workstation ]#    ;  hostname ip-172-31-35-13.ec2.internal

    - name: Run hostname command
      ansible.builtin.command: hostname
      register: result
    
    # varible

    - name: Print command results
      ansible.builtin.debug:
        msg:
          - "Return Code: {{ result.rc }}"
          - "Standard Output: {{ result.stdout }}"
          - "Standard Error: {{ result.stderr }}"

    # loop
    - name: Print all values
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop:
        - "RC: {{ result.rc }}"
        - "STDOUT: {{ result.stdout }}"
        - "STDERR: {{ result.stderr }}"
    
