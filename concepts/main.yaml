- name: debug
  hosts: all
  become: true

  tasks:
    - name: print the os family
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop:
        - "{{ ansible_os_family }}"
        - "{{ ansible_architecture }}"
      register: os_info

    # - name: print os info results
    #   ansible.builtin.debug:
    #     msg: "{{ os_info.results }}"

- name: conditional task
  hosts: all    
  become: true
  tasks:
    - name: conditional task based on os family
      ansible.builtin.debug:
        msg: "This is a RedHat based system"
      when: ansible_os_family == "RedHat"
